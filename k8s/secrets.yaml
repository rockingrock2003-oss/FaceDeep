apiVersion: v1
kind: Secret
metadata:
  name: facedeep-secrets
  namespace: facedeep
type: Opaque
stringData:
  POSTGRES_USER: "facedeep"
  POSTGRES_PASSWORD: "facedeep_secret"
  POSTGRES_DB: "facedeep"
  DATABASE_URL: "postgresql+asyncpg://facedeep:facedeep_secret@postgres:5432/facedeep"
  SECRET_KEY: "change-this-in-production-to-a-random-string"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: facedeep-config
  namespace: facedeep
data:
  CHROMA_HOST: "chromadb"
  CHROMA_PORT: "8000"
  CHROMA_PERSIST_DIR: "/app/chroma_data"
  ARCFACE_MODEL_PATH: "buffalo_l"
  FACE_RECOGNITION_THRESHOLD: "0.4"
  LIVENESS_MIN_SCORE: "70"
