replicaCount: 2

image:
  repository: ghcr.io/facedeep/facedeep
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: api.facedeep.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: facedeep-tls
      hosts:
        - api.facedeep.com

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 2Gi

env:
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: facedeep-secrets
        key: database-url
  - name: REDIS_URL
    valueFrom:
      secretKeyRef:
        name: facedeep-secrets
        key: redis-url
  - name: SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: facedeep-secrets
        key: secret-key
  - name: ENVIRONMENT
    value: production

probes:
  liveness:
    path: /health
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 10
  readiness:
    path: /ready
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
  startup:
    path: /startup
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 5
