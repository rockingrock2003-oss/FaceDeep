<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Employee Enrolment</title>
<link rel="stylesheet" href="/static/app.css">
<style>
  .grid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 16px; }
  @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
  .cam { position: relative; border-radius: var(--radius); overflow: hidden; background: #000; aspect-ratio: 4 / 3; }
  .cam video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
  .cam .status { top: 12px; font-size: 15px; }
  .thumbs { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .thumbs img { width: 88px; height: 88px; object-fit: cover; border-radius: 10px; border: 2px solid #30363d; }
  .row { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  pre { white-space: pre-wrap; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">Attendance kiosk</div>
  <nav><a href="/">Check in</a><a href="/enroll" class="active">Enrol</a><a href="/dashboard">Dashboard</a><a href="/liveness-test">Liveness test</a></nav>
</div>
<div class="wrap grid">
  <div>
    <div class="cam"><video id="video" autoplay playsinline muted></video><div class="status" id="status">Starting camera...</div></div>
    <div class="thumbs" id="thumbs"></div>
    <div class="row">
      <button id="auto">Capture 3 photos</button>
      <button class="secondary" id="clear">Clear</button>
      <label class="btn secondary" style="margin:0;color:#fff;font-size:16px">Upload existing photos<input id="files" type="file" accept="image/jpeg,image/png" multiple hidden></label>
    </div>
    <p class="muted">Tip: migrating from Rekognition? Upload the photos you originally enrolled with - Rekognition never returns face templates, so the original photos are what carries over.</p>
  </div>
  <div class="card">
    <h3 style="margin-top:0">New employee</h3>
    <label for="eid">Employee ID (ExternalImageId)</label>
    <input id="eid" placeholder="EMP-0042" pattern="[a-zA-Z0-9_.\-:]+">
    <label for="name">Name</label>
    <input id="name" placeholder="Jane Perera">
    <div class="row"><button id="save" disabled>Enrol</button></div>
    <pre id="out"></pre>
    <h3>Enrolled</h3>
    <table><thead><tr><th>ID</th><th>Name</th><th>Faces</th><th></th></tr></thead><tbody id="emps"></tbody></table>
  </div>
</div>
<script type="module">
import { startCamera, createDetector, capture, Framing, sleep } from "/static/face.js?v=3";
const $ = (id) => document.getElementById(id);
const video = $("video"), statusEl = $("status");
let shots = [];
let detector;
const framing = new Framing({ minWidth: 0.2, stableMs: 300 });

function render() {
  $("thumbs").innerHTML = shots.map((s) => `<img src="${s}">`).join("");
  $("save").disabled = !shots.length || !$("eid").value.trim();
}
$("eid").addEventListener("input", render);
$("clear").onclick = () => { shots = []; render(); };
$("files").onchange = async (e) => {
  for (const f of e.target.files) {
    shots.push(await new Promise((res) => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(f); }));
  }
  render();
};

$("auto").onclick = async () => {
  $("auto").disabled = true;
  let n = 0;
  const prompts = ["Look straight at the camera", "Turn your head slightly left", "Turn your head slightly right"];
  while (n < 3) {
    statusEl.textContent = prompts[n];
    const a = framing.assess(detector.detect(video), video);
    if (a.ok) {
      shots.push(capture(video, 1024, 0.92));
      render();
      n++;
      framing.reset();
      await sleep(900);
    } else {
      await sleep(80);
    }
  }
  statusEl.textContent = "Done";
  $("auto").disabled = false;
};

$("save").onclick = async () => {
  $("save").disabled = true;
  $("out").textContent = "Enrolling...";
  const r = await fetch("/api/enroll", {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ employee_id: $("eid").value.trim(), name: $("name").value.trim(), images: shots }),
  });
  const j = await r.json();
  if (!r.ok) { $("out").textContent = "Error: " + (j.detail || r.status); $("save").disabled = false; return; }
  const lines = j.results.map((x, i) => {
    let s = `Photo ${i + 1}: ${x.indexed ? "indexed" : "NOT indexed " + JSON.stringify(x.unindexed_reasons)}`;
    if (x.lookalike_warning) s += `\n  WARNING: very similar to already-enrolled ${x.lookalike_warning} (twin? duplicate enrolment?)`;
    return s;
  });
  $("out").textContent = lines.join("\n");
  shots = []; render(); loadEmps();
};

async function loadEmps() {
  const emps = await fetch("/api/employees").then((r) => r.json());
  $("emps").innerHTML = emps.map((e) => `<tr><td>${e.employee_id}</td><td>${e.name}</td><td>${e.faces}</td><td><a href="#" data-del="${e.employee_id}">remove</a></td></tr>`).join("");
  document.querySelectorAll("[data-del]").forEach((a) => a.onclick = async (ev) => {
    ev.preventDefault();
    if (!confirm(`Remove ${a.dataset.del} and delete their face data?`)) return;
    await fetch(`/api/employees/${encodeURIComponent(a.dataset.del)}`, { method: "DELETE" });
    loadEmps();
  });
}

(async () => {
  loadEmps();
  try { await startCamera(video); } catch { statusEl.textContent = "Camera unavailable (HTTPS required) - you can still upload photos"; return; }
  detector = await createDetector();
  statusEl.textContent = "Ready";
})();
</script>
</body>
</html>
