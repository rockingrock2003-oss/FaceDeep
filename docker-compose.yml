services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-facedeep}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-facedeep_secret}
      POSTGRES_DB: ${POSTGRES_DB:-facedeep}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-facedeep}"]
      interval: 10s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      ANONYMIZED_TELEMETRY: "False"

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-facedeep}:${POSTGRES_PASSWORD:-facedeep_secret}@postgres:5432/${POSTGRES_DB:-facedeep}
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      CHROMA_PERSIST_DIR: /app/chroma_data
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_started
    volumes:
      - chroma_app_data:/app/chroma_data

volumes:
  postgres_data:
  chroma_data:
  chroma_app_data:
