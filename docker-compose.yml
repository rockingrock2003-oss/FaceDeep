# Production-style single node. Put a TLS-terminating reverse proxy (nginx,
# Caddy, an ALB) in front, or pass --ssl-certfile/--ssl-keyfile.
#
#   cp .env.example .env    # fill in the secrets
#   docker compose up -d --build
services:
  facegate:
    build: .
    image: facegate:0.1.0
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - facegate-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    # Measured: ~200 MB RAM with 1,000 faces; a Secure check-in costs ~0.6 s
    # of one core. 2 vCPU covers ~2,000 employees arriving in the same
    # 15 minutes (see README "Sizing").
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g

volumes:
  facegate-data:
